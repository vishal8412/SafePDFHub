<footer
  class="studio-status-bar"
  aria-label="Document status and controls">

  <!-- ========================================================
       LEFT — PROCESSING STATUS
  ========================================================= -->

  <div class="studio-status-bar__left">

  <div
    class="processing-status"
    [class.processing-status--processing]="processingState === 'processing'"
    [class.processing-status--saving]="processingState === 'saving'"
    [class.processing-status--error]="processingState === 'error'"
    [class.processing-status--ready]="processingState === 'ready'"
    role="status"
    [attr.aria-live]="processingState === 'processing' ? 'polite' : 'off'">

    <span class="processing-status__icon" aria-hidden="true">

      @if (processingState === 'error') {

        <svg viewBox="0 0 24 24">
          <path d="M12 4 21 20H3z" />
          <path d="M12 9v5" />
          <path d="M12 17h.01" />
        </svg>

      } @else {

        <svg viewBox="0 0 24 24">
          <path d="M12 3.5 19 6v5.2c0 4.6-2.8 7.9-7 9.3-4.2-1.4-7-4.7-7-9.3V6z" />
          <path d="m8.5 12 2.3 2.3 4.7-5" />
        </svg>

      }

    </span>

    <span class="processing-status__label">
      {{ processingMessage }}
    </span>

  </div>

  <button
    type="button"
    class="info-button"
    aria-label="Browser processing information"
    title="Browser processing information"
    (click)="requestProcessingInfo()">

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 10.5v5" />
      <path d="M12 7.5h.01" />
    </svg>

  </button>

</div>

  <!-- ========================================================
       CENTER — PAGE NAVIGATION
  ========================================================= -->

  <div class="studio-status-bar__center">

    <button
      type="button"
      class="navigation-button"
      [disabled]="!canPreviousPage"
      aria-label="Previous page"
      title="Previous page"
      (click)="goToPreviousPage()">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m14.5 6-6 6 6 6" />
      </svg>

    </button>

    <div
  class="page-indicator"
  [class.page-indicator--invalid]="pageJumpError"
  [attr.aria-label]="pageDescription">

  <input
    class="page-indicator__input"
    type="number"
    min="1"
    [max]="totalPages"
    step="1"
    inputmode="numeric"
    [value]="pageInputValue"
    [attr.aria-label]="
      'Current page number, 1 to ' + totalPages
    "
    [attr.aria-invalid]="
      pageJumpError
        ? 'true'
        : 'false'
    "
    [attr.title]="
      pageJumpError ||
      'Enter a page number'
    "
    (input)="onPageInput($event)"
    (blur)="commitPageInput($event)"
    (keydown.enter)="commitPageInput($event)"
    (keydown.escape)="cancelPageInput($event)"
  />

  <span
    class="page-indicator__separator"
    aria-hidden="true">
    /
  </span>

  <span class="page-indicator__total">
    {{ totalPages }}
  </span>

  @if (pageJumpError) {

    <span
      class="page-jump-error"
      role="alert">

      {{ pageJumpError }}

    </span>

  }

</div>

    <button
      type="button"
      class="navigation-button"
      [disabled]="!canNextPage"
      aria-label="Next page"
      title="Next page"
      (click)="goToNextPage()">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m9.5 6 6 6-6 6" />
      </svg>

    </button>

  </div>


  <!-- ========================================================
       RIGHT — VIEW / ZOOM / PAGE / STATE
  ========================================================= -->

  <div class="studio-status-bar__right">

    <!-- View mode -->

    <button
      type="button"
      class="view-button"
      [attr.aria-label]="
        viewMode === 'fit-page'
          ? 'Fit width'
          : 'Fit page'
      "
      [title]="
        viewMode === 'fit-page'
          ? 'Fit width'
          : 'Fit page'
      "
      (click)="toggleViewMode()">

      @if (viewMode === 'fit-page') {

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 9V5h4" />
          <path d="M15 5h4v4" />
          <path d="M19 15v4h-4" />
          <path d="M9 19H5v-4" />
          <path d="M9 5 5 9" />
          <path d="m15 5 4 4" />
          <path d="m19 15-4 4" />
          <path d="m9 19-4-4" />
        </svg>

      } @else {

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>

      }

    </button>


    <div class="status-divider" aria-hidden="true"></div>


    <!-- Zoom -->

    <div class="zoom-control">

      <button
        type="button"
        class="zoom-step-button"
        [disabled]="zoom <= minZoom"
        aria-label="Zoom out"
        title="Zoom out"
        (click)="zoomOut()">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" />
        </svg>

      </button>

      <select
        class="zoom-select"
        [value]="zoom"
        [attr.aria-label]="'Zoom level ' + zoom + '%'"
        (change)="onZoomSelect($event)">

        <option value="50">50%</option>
        <option value="75">75%</option>
        <option value="100">100%</option>
        <option value="125">125%</option>
        <option value="150">150%</option>
        <option value="175">175%</option>
        <option value="200">200%</option>

      </select>

      <button
        type="button"
        class="zoom-step-button"
        [disabled]="zoom >= maxZoom"
        aria-label="Zoom in"
        title="Zoom in"
        (click)="zoomIn()">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>

      </button>

    </div>


    <div class="status-divider" aria-hidden="true"></div>


    <!-- Page description -->

    <div
      class="page-description"
      [attr.aria-label]="pageDescription">

      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 4h12v16H6z" />
        <path d="M9 8h6M9 12h6M9 16h4" />
      </svg>

      <span>
        Page {{ currentPage }} of {{ totalPages }}
      </span>

    </div>


    <div class="status-divider" aria-hidden="true"></div>


    <!-- Ready state -->

    <div
      class="document-state"
      [class.document-state--processing]="
        processingState === 'processing'
      "
      [class.document-state--saving]="
        processingState === 'saving'
      "
      [class.document-state--error]="
        processingState === 'error'
      "
      [class.document-state--ready]="
        processingState === 'ready'
      ">

      <span
        class="document-state__dot"
        aria-hidden="true">
      </span>

      <span class="document-state__label">
        {{ statusLabel }}
      </span>

    </div>

  </div>

</footer>
