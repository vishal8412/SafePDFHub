@if (!showBuilder) {
  <div class="studio-sign-picker" role="dialog" aria-modal="true" aria-label="Add signing field">
    <section studioDialogFocus (dialogEscape)="closed.emit()" class="studio-sign-picker__panel" (click)="$event.stopPropagation()">
      <header>
        <div><span>SIGN & FILL</span><h2>Add a signing field</h2><p>Choose what you want to place on the PDF.</p></div>
        <button type="button" (click)="closed.emit()" aria-label="Close">×</button>
      </header>
      <div class="studio-sign-picker__grid">
        @for (item of fieldItems; track item.kind) {
          <button type="button" (click)="choose(item.kind)">@if (item.kind === 'signature') { <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17c7-13 12-13 7-4-4 7-8 6-5 2 2-3 4 4 8 0l5-5M3 21h18"/></svg> } @else { <b aria-hidden="true">{{ item.icon }}</b> }<span>{{ item.label }}</span><small>{{ item.description }}</small></button>
        }
      </div>
    </section>
  </div>
} @else {
  <app-signature-builder [kind]="builderKind" (closed)="closed.emit()" (created)="created($event)" />
}
