<section
  class="studio-toolbar"
  aria-label="PDF editing tools">

  <div class="studio-toolbar__surface">

    <!-- F5 — Visible document history controls. -->
    <button
      type="button"
      class="studio-toolbar__history"
      [disabled]="!canUndo"
      aria-label="Undo"
      title="Undo (Ctrl/Cmd+Z)"
      (click)="undo.emit()">

      <span
        class="studio-toolbar__icon"
        aria-hidden="true">

        <svg viewBox="0 0 24 24">
          <path d="M9 7 4 12l5 5" />
          <path d="M5 12h9a6 6 0 1 1-4.2 10.2" />
        </svg>

      </span>

      <span class="studio-toolbar__label">
        Undo
      </span>

    </button>

    <button
      type="button"
      class="studio-toolbar__history"
      [disabled]="!canRedo"
      aria-label="Redo"
      title="Redo (Ctrl/Cmd+Shift+Z or Ctrl/Cmd+Y)"
      (click)="redo.emit()">

      <span
        class="studio-toolbar__icon"
        aria-hidden="true">

        <svg viewBox="0 0 24 24">
          <path d="m15 7 5 5-5 5" />
          <path d="M19 12h-9a6 6 0 1 0 4.2 10.2" />
        </svg>

      </span>

      <span class="studio-toolbar__label">
        Redo
      </span>

    </button>

    <span
      class="studio-toolbar__divider"
      aria-hidden="true">
    </span>

    @for (tool of tools; track tool.id) {

      <button
        type="button"
        class="studio-toolbar__tool"
        [class.studio-toolbar__tool--active]="isActive(tool.id)"
        [class.studio-toolbar__tool--destructive]="tool.destructive"
        [attr.aria-label]="tool.label"
        [attr.aria-pressed]="isActive(tool.id)"
        [attr.title]="tool.shortcut
          ? tool.label + ' (' + tool.shortcut + ')'
          : tool.label"
        (click)="selectTool(tool)">

        <span
          class="studio-toolbar__icon"
          aria-hidden="true">

          @switch (tool.id) {

            @case ('select') {
              <svg viewBox="0 0 24 24">
                <path d="M6 3.5 18 14l-5.2.7 3.1 5.2-2.2 1.3-3.1-5.2-3.1 4.1z" />
              </svg>
            }

            @case ('hand') {
              <svg viewBox="0 0 24 24">
                <path d="M7.5 12V6.8a1.5 1.5 0 0 1 3 0v4.1V5.4a1.5 1.5 0 0 1 3 0v5.5V6.2a1.5 1.5 0 0 1 3 0v6.1V8.5a1.5 1.5 0 0 1 3 0v6.2c0 4.1-2.7 6.8-6.6 6.8h-.9c-2.2 0-3.7-1-5-2.7L4.2 15.9a1.7 1.7 0 0 1 2.7-2.1z" />
              </svg>
            }

            @case ('text') {
              <svg viewBox="0 0 24 24">
                <path d="M5 5h14M12 5v14M8 19h8" />
              </svg>
            }

            @case ('image') {
              <svg viewBox="0 0 24 24">
                <rect x="4" y="4" width="16" height="16" rx="2" />
                <circle cx="9" cy="9" r="1.5" />
                <path d="m5.5 17 4.2-4.2 3.1 3.1 2.2-2.2 3.5 3.5" />
              </svg>
            }

            @case ('draw') {
              <svg viewBox="0 0 24 24">
                <path d="m5 19 1.2-4.2L16.8 4.2a2 2 0 0 1 2.8 2.8L9 17.6z" />
                <path d="m14.5 6.5 3 3" />
                <path d="M5 19h4" />
              </svg>
            }

            @case ('highlight') {
              <svg viewBox="0 0 24 24">
                <path d="m5 16 8.5-8.5 4 4L9 20H5z" />
                <path d="M4 20h16" />
              </svg>
            }

            @case ('shape') {
              <svg viewBox="0 0 24 24">
                <rect x="4" y="5" width="8" height="8" rx="1" />
                <circle cx="16.5" cy="15.5" r="4" />
              </svg>
            }

            @case ('rotate') {
              <svg viewBox="0 0 24 24">
                <path d="M20 8V4l-2.2 2.2A8 8 0 1 0 19.5 15" />
                <path d="M20 4h-4" />
              </svg>
            }

            @case ('delete') {
              <svg viewBox="0 0 24 24">
                <path d="M5 7h14M9 7V4h6v3M8 7l1 13h6l1-13M10 10v7M14 10v7" />
              </svg>
            }

            @case ('extract') {
              <svg viewBox="0 0 24 24">
                <rect x="4" y="4" width="11" height="16" rx="1.5" />
                <path d="M15 8h5v12H9v-4" />
                <path d="m13 12 4-4m0 0v3m0-3h-3" />
              </svg>
            }

            @case ('comment') {
              <svg viewBox="0 0 24 24">
                <path d="M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-4.5 3V18H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" />
                <path d="M8 10h8M8 14h5" />
              </svg>
            }

            @case ('link') {
              <svg viewBox="0 0 24 24">
                <path d="m9.5 14.5 5-5" />
                <path d="M7.2 17.8 5.8 19.2a3.2 3.2 0 0 1-4.5-4.5l3.5-3.5a3.2 3.2 0 0 1 4.5 0" />
                <path d="m16.8 6.2 1.4-1.4a3.2 3.2 0 0 1 4.5 4.5l-3.5 3.5a3.2 3.2 0 0 1-4.5 0" />
              </svg>
            }

            @case ('more') {
              <svg viewBox="0 0 24 24">
                <circle cx="5" cy="12" r="1.4" />
                <circle cx="12" cy="12" r="1.4" />
                <circle cx="19" cy="12" r="1.4" />
              </svg>
            }

          }

        </span>

        <span class="studio-toolbar__label">
          {{ tool.label }}
        </span>

      </button>
    }

  </div>

</section>
