<header class="studio-header">
  <div class="studio-navigation">
    <a class="studio-brand" routerLink="/" aria-label="SafePDFHub home"
      ><img src="assets/brand/safepdfhub-logo-navbar.svg" alt="SafePDFHub" width="178" height="38"
    /></a>
    <span class="studio-title">PDF Studio</span>
    <nav class="studio-navigation__actions" aria-label="Studio navigation">
      <details name="studio-navigation" class="studio-nav-menu studio-tools-menu">
        <summary>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1.5" />
            <rect x="14" y="3" width="7" height="7" rx="1.5" />
            <rect x="3" y="14" width="7" height="7" rx="1.5" />
            <rect x="14" y="14" width="7" height="7" rx="1.5" /></svg
          ><span>PDF Tools</span
          ><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 10 5 5 5-5" />
          </svg>
        </summary>
        <div class="studio-menu-panel">
          <div class="studio-menu-heading">
            <strong>More ways to work with PDFs</strong><span>Explore SafePDFHub tools</span>
          </div>
          <div class="studio-tools-grid">
            @for (tool of toolsCatalog; track tool.slug) {
              <a [routerLink]="['/tools', tool.slug]" (click)="closeMenus()"
                ><strong>{{ tool.label }}</strong
                ><span>{{ tool.shortDescription }}</span></a
              >
            }
          </div>
          <a class="studio-all-tools" routerLink="/" fragment="tools" (click)="closeMenus()"
            >Explore all PDF tools <span aria-hidden="true">→</span></a
          >
        </div>
      </details>
      <details name="studio-navigation" class="studio-nav-menu studio-layout-menu">
        <summary>
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M3 9h18M8 9v11" /></svg
          ><span>Layout</span
          ><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m7 10 5 5 5-5" />
          </svg>
        </summary>
        <div class="studio-menu-panel">
          <strong class="studio-layout-heading">Workspace layout</strong
          ><label
            ><span><strong>Document bar</strong><small>File actions and export</small></span
            ><input
              type="checkbox"
              [checked]="documentBarVisible"
              (change)="documentBarToggle.emit()" /></label
          ><label
            ><span><strong>Editing toolbar</strong><small>Text, images and annotations</small></span
            ><input type="checkbox" [checked]="toolbarVisible" (change)="toolbarToggle.emit()"
          /></label>
        </div>
      </details>
    </nav>
  </div>
  @if (documentBarVisible) {
    <div class="studio-document-bar">
      <div class="document-info">
        <span class="document-icon" aria-hidden="true"
          ><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6" /></svg
        ></span>
        <div class="document-copy">
          <strong class="project-name" [title]="documentName">{{ documentName }}</strong
          ><span class="project-status"
            ><i [class.is-ready]="statusReady"></i>{{ documentStatus }}</span
          >
        </div>
      </div>
      <div class="header-right">
        <button
          type="button"
          class="secondary-btn open-btn"
          (click)="openPdf.emit()"
          [attr.aria-label]="openButtonLabel"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 3h8l4 4v4M14 3v5h4M6 3v18h7M16 15h6m-3-3v6" /></svg
          >{{ openButtonLabel }}</button
        ><button
          type="button"
          class="secondary-btn security-btn"
          [disabled]="!pdfLoaded"
          (click)="security.emit()"
          aria-label="Protect PDF"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="10" width="14" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg
          >Protect PDF</button
        ><button
          type="button"
          class="primary-btn"
          [disabled]="!pdfLoaded"
          (click)="exportPdf.emit()"
          aria-label="Export PDF"
        >
          Export PDF
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5" />
          </svg>
        </button>
      </div>
    </div>
  }
</header>
