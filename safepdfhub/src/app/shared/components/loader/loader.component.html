<div class="app-loader" *ngIf="loader.loading()">
  <div class="bg-glow"></div>

  <div class="loader-content">
    <img
      class="logo-image"
      src="assets/brand/safepdfhub-logo-primary.svg"
      alt="SafePDFHub — Private PDF tools. Built for you."
      width="390"
      height="88"
      decoding="async"
    />

    <div class="progress-wrapper">
      <div
        class="progress-bar"
        role="progressbar"
        aria-label="Processing progress"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="loader.determinate() ? loader.progress() : null"
      >
        <div class="progress-fill" [style.width.%]="loader.progress()"></div>
      </div>
    </div>

    <p class="status-text" role="status" aria-live="polite">
      {{ loader.text() }}
      <span class="typing"></span>
    </p>

    @if (loader.page(); as page) {
      <p class="page-progress">Page {{ page.current }} of {{ page.total }}</p>
    }
    @if (loader.determinate()) {
      <p class="page-progress">{{ loader.progress() | number: '1.0-0' }}%</p>
    }
    @if (loader.cancellationAvailable()) {
      <button
        type="button"
        class="loader-cancel-button"
        (click)="loader.cancelActiveTask()"
        aria-label="Cancel current operation"
      >
        Cancel
      </button>
    }
  </div>
</div>
