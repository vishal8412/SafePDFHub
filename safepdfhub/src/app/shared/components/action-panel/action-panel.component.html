<div class="smart-panel">

  <div class="panel-header">
    <h2>{{ title }}</h2>
    <p class="panel-sub">{{ subtitle }}</p>
  </div>

  <div class="action-grid" *ngIf="actions.length">
    <a
      *ngFor="let action of actions; trackBy: trackByActionId"
      class="action-card"
      [class.primary]="action.primary"
      [routerLink]="['/tools', action.id]"
    >
      <div class="action-top">
        <span class="action-icon" aria-hidden="true">
          <lucide-icon [img]="action.icon" size="20"></lucide-icon>
        </span>
      </div>
      <div class="action-copy">
        <div class="title">{{ action.title }}</div>
        <div class="desc">{{ action.desc }}</div>
      </div>
      <span class="action-open">Open tool <b aria-hidden="true">↗</b></span>
    </a>
  </div>

  <a
    class="view-all-tools"
    href="/#tools"
    (click)="navigateToHomeSection($event, 'tools')"
  >
    <span>{{ viewAllLabel }}</span>
    <span aria-hidden="true">→</span>
  </a>

  <div class="trust-strip" *ngIf="trustItems.length">
    <div class="trust-item" *ngFor="let item of trustItems; trackBy: trackByTrustIcon">
      <span class="trust-icon" [class]="'trust-icon--' + item.icon" aria-hidden="true"></span>
      <span>{{ item.title }}</span>
    </div>
  </div>

</div>
