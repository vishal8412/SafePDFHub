<div
  class="upload-box"
  [class.dragging]="isDragging"
  (drop)="onDrop($event)"
  (dragover)="allowDrop($event)"
  (dragleave)="onLeave()"
>
  <p>Drag &amp; drop PDF files here</p>

  <label class="upload-btn">
    Select PDF files
    <input
      type="file"
      accept=".pdf,application/pdf"
      [attr.multiple]="allowMultiple ? '' : null"
      (change)="onFileSelect($event)"
      hidden
    />
  </label>

  <div class="limits">
    Up to {{ maxFileMB }} MB per file<span *ngIf="allowMultiple"> • {{ maxTotalMB }} MB total</span>
  </div>
</div>
