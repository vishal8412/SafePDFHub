<header class="site-header">
  <div class="header-inner">
    <a class="logo" routerLink="/" aria-label="SafePDFHub home">
      <img
        src="assets/brand/safepdfhub-logo-navbar.svg"
        alt="SafePDFHub"
        width="246"
        height="52"
        decoding="async" />
    </a>

    <nav class="desktop-nav" aria-label="Main navigation">
      <a href="/#features" (click)="navigateToHomeSection($event, 'features')">Why SafePDFHub</a>
      <a href="/#tools" (click)="navigateToHomeSection($event, 'tools')">Tools</a>
      <a href="/#how-it-works" (click)="navigateToHomeSection($event, 'how-it-works')">How it works</a>
      <a routerLink="/studio" class="nav-cta">Open Editor <b>→</b></a>
    </nav>

    <button
      class="menu-btn"
      type="button"
      [attr.aria-expanded]="mobileMenuOpen"
      aria-label="Open menu"
      (click)="mobileMenuOpen = !mobileMenuOpen">
      <span></span><span></span>
    </button>
  </div>

  <div class="mobile-menu" *ngIf="mobileMenuOpen">
    <a href="/#features" (click)="navigateToHomeSection($event, 'features')">Why SafePDFHub</a>
    <a href="/#tools" (click)="navigateToHomeSection($event, 'tools')">Tools</a>
    <a href="/#how-it-works" (click)="navigateToHomeSection($event, 'how-it-works')">How it works</a>
    <a routerLink="/studio" class="mobile-cta" (click)="mobileMenuOpen = false">Open PDF Editor →</a>
  </div>
</header>
