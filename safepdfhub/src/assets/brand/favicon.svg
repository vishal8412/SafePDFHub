<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SafePDFHub mark</title>
  <desc id="desc">A custom SafePDFHub shield and document symbol.</desc>
  <defs>
    <linearGradient id="sphMarkShield" x1="8" y1="7" x2="64" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27E6D4"/>
      <stop offset="0.52" stop-color="#12BFEA"/>
      <stop offset="1" stop-color="#1675E8"/>
    </linearGradient>
    <linearGradient id="sphMarkPaper" x1="28" y1="24" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22E1D0"/>
      <stop offset="1" stop-color="#4AAFFF"/>
    </linearGradient>
  </defs>

  <!-- Outer shield silhouette -->
  <path
    d="M36 4.5 65 15v23.2C65 55.9 54.2 67.1 36 75.5 17.8 67.1 7 55.9 7 38.2V15L36 4.5Z"
    fill="url(#sphMarkShield)"/>

  <!-- Inner shield creates the protected/secure field -->
  <path
    d="M36 11.7 57.8 19.6v18.8c0 12.8-7.2 22.1-21.8 28.8-14.6-6.7-21.8-16-21.8-28.8V19.6L36 11.7Z"
    fill="#071B2C"/>

  <!-- Signature document: centered, folded corner aligned with the shield -->
  <path
    d="M25.5 24.2h16.2l6.8 6.8v25H25.5v-31.8Z"
    fill="#071B2C"
    stroke="url(#sphMarkPaper)"
    stroke-width="2.35"
    stroke-linejoin="round"/>
  <path
    d="M41.7 24.2V31h6.8"
    stroke="url(#sphMarkPaper)"
    stroke-width="2.35"
    stroke-linejoin="round"/>

  <!-- Three compact document strokes; the stepped lengths create the hub signature -->
  <path
    d="M30.5 38.8h13.5M30.5 45.2h11.1M30.5 51.6h7.3"
    stroke="url(#sphMarkPaper)"
    stroke-width="2.65"
    stroke-linecap="round"/>
</svg>
